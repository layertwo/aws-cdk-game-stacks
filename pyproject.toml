[project]
name = "aws-cdk-game-stacks"
version = "0.1.0"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aws-cdk-lib==2.261.0",
    "cdk-monitoring-constructs==10.2.0",
    "constructs==10.7.1",
    "uv-python-lambda==0.0.7"
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "black==26.5.1",
    "isort==8.0.1",
    "flake8==7.3.0",
    "Flake8-pyproject==1.2.4"
]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # ponytail: repo root on sys.path so `cdk` imports; project isn't pip-installed
addopts = [
    "--verbose",
    "--cov=cdk",
    "--cov-report=term-missing",
    "--cov-report=term",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=50",
    "-n=auto"
]

[tool.coverage.run]
source = ["cdk"]
omit = [
    "*/tests/*",
    "*/test_*",
]
branch = true
parallel = true
relative_files = true

[tool.coverage.report]
exclude_lines = [
    "pragma: nocover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "pass",
]

[tool.black]
line_length = 100
target-version = ["py314"]
src = ["cdk/", "tests/"]


[tool.isort]
known_first_party = "cdk"
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
combine_as_imports = false
skip = [".git", "cdk.out", "venv"]


[tool.flake8]
exclude = "cdk.out"
ignore = ["E203", "W503", "E501"]
max_line_length = 100
