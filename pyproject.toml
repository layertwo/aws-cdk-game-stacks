[tool.poetry]
name = "aws-cdk-game-stacks"
version = "0.1.0"
description = "CDK game stacks"
authors = ["Lucas Messenger <1335960+layertwo@users.noreply.github.com>"]
license = "Apache-2.0"
readme = "README.md"
packages = [
    { include = "lib" },
    { include = "lambda" }
]


[tool.poetry.dependencies]
python = "^3.11"
aws-cdk-lib = "^2.186.0"
constructs = "^10.4.4"
boto3 = "^1.42.19"


[tool.poetry.group.dev.dependencies]
isort = "^7.0.0"
black = "^26.0.0"
flake8 = "^7.3.0"
flake8-pyproject = "^1.2.4"
pytest = "^9.0.0"
pytest-cov = "^7.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.black]
line_length = 100


[tool.isort]
known_first_party = "lib"
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
combine_as_imports = false
skip = [".git", "cdk.out", "venv"]


[tool.flake8]
exclude = "cdk.out"
ignore = ["E203", "W503", "E501"]
max_line_length = 100


[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--strict-markers",
    "--strict-config",
    "--cov=lib",
    "--cov-report=term-missing",
    "--cov-report=term",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=80"
]

[tool.coverage.run]
source = ["lib"]
omit = [
    "*/tests/*",
    "*/test_*",
    "lib/constructs/traefik.py",
]
branch = true
parallel = true
relative_files = true