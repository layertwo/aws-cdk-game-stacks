name: deploy

# This workflow uses OpenID Connect (OIDC) to securely authenticate with AWS
# without storing long-term access keys.
#
# Setup Instructions:
# 1. Bootstrap CDK: cd cdk && npx cdk bootstrap aws://ACCOUNT-ID/us-east-1
# 2. Deploy OIDC stack: cd cdk && npm run deploy:oidc
#    (Set GITHUB_ORG and GITHUB_REPO environment variables first)
# 3. Add GitHub secret:
#    - AWS_ROLE_ARN: From OIDC stack output
#
# The OIDC stack (cdk/lib/github-oidc.ts) creates:
# - GitHub OIDC identity provider in AWS
# - IAM role with permissions to assume CDK bootstrap roles
# - Proper trust policy for your repository
#
# For more information:
# https://docs.github.com/en/actions/how-tos/secure-your-work/security-harden-deployments/oidc-in-aws

on:
  workflow_dispatch:
  push:
    branches:
      - mainline
    paths:
      - 'cdk/**'
      - 'lambda/**'
      - '.github/workflows/deploy.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'cdk.json'
      - 'cdk.context.json'


concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: "ca-central-1"

jobs:
  deploy:
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        python-version: ["3.14"]
    permissions:
      contents: read
      id-token: write  # Required for OIDC authentication

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --all-extras --all-groups

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install -g aws-cdk

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK Synthesize
        run: uv run cdk context --clear && uv run cdk synth

      - name: CDK Deploy
        run: uv run cdk deploy --all --require-approval never --outputs-file outputs.json

      - name: Display deployment outputs
        run: |
          if [ -f outputs.json ]; then
            echo "Deployment outputs:"
            cat outputs.json
          fi
